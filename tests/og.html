<!doctype html>
<!-- Never deployed. Draws the share picture (assets/og-v2.jpg) and the README picture (docs/preview-postcard.png) with the real engine.
     tests/make-assets.js opens it over http and captures it.  ?mode=og (default) | postcard | film -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Look Up: share picture</title>
<style>
  @font-face { font-family: "Fraunces"; src: url("../fonts/fraunces-700.woff2") format("woff2"); font-weight: 700; font-style: normal; }
  @font-face { font-family: "Fraunces"; src: url("../fonts/fraunces-600-italic.woff2") format("woff2"); font-weight: 600; font-style: italic; }
  :root { --ink: #1d2b53; --serif: "Fraunces", Georgia, "Times New Roman", serif; }
  html, body { margin: 0; padding: 0; background: #ffd9c0; }
  /* the golden-hour sky: morning blue through blush to peach, a sun glow top right, a few soft clouds */
  #og { position: relative; width: 1200px; height: 630px; overflow: hidden; display: none;
        background:
          radial-gradient(ellipse 260px 70px at 150px 560px, rgba(255,255,255,.55), rgba(255,255,255,0) 100%),
          radial-gradient(ellipse 320px 80px at 620px 600px, rgba(255,255,255,.5), rgba(255,255,255,0) 100%),
          radial-gradient(ellipse 240px 64px at 330px 70px, rgba(255,255,255,.5), rgba(255,255,255,0) 100%),
          radial-gradient(ellipse 360px 360px at 1120px 40px, rgba(255,236,218,.6), rgba(255,236,218,0) 100%),
          linear-gradient(180deg, #9cc7f2 0%, #ffc4d4 56%, #ffd9c0 100%); }
  #og .copy { position: absolute; left: 80px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  #og h1 { font-family: var(--serif); font-weight: 700; font-size: 64px; line-height: 1.08; color: var(--ink); margin: 0; letter-spacing: -.012em; }
  #og .url { font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 30px; color: var(--ink); opacity: .8; margin: 28px 0 0; }
  #og .cardwrap { position: absolute; right: 64px; top: 50%; width: 490px; height: 490px; margin-top: -245px; transform: rotate(2.5deg);
                  border-radius: 24px; box-shadow: 0 20px 44px rgba(58, 46, 128, .28), 0 3px 8px rgba(58, 46, 128, .16); overflow: hidden; }
  #og canvas, #solo canvas { display: block; width: 100%; height: 100%; }
  #og .sp { position: absolute; width: 14px; height: 14px; background: #fff; opacity: .8;
            clip-path: polygon(50% 0, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0 50%, 42% 42%); }
  #solo { display: none; }
</style>
</head>
<body>
<div id="og"><div class="copy"><h1>Saw a shape in the clouds? Send it to someone.</h1><p class="url">look-up-sky.vercel.app</p></div>
  <div class="cardwrap"><canvas id="ogCanvas" width="960" height="960"></canvas></div>
  <i class="sp" style="left:56px;top:70px"></i><i class="sp" style="left:600px;top:40px;width:10px;height:10px"></i>
  <i class="sp" style="left:660px;top:560px;width:12px;height:12px"></i><i class="sp" style="left:1150px;top:560px"></i>
  <i class="sp" style="left:40px;top:540px;width:9px;height:9px"></i></div>
<div id="solo"><canvas id="soloCanvas" width="900" height="900"></canvas></div>
<script src="../src/engine/util.js"></script>
<script src="../src/engine/decode.js"></script>
<script src="../src/engine/sky.js"></script>
<script src="../src/engine/trace.js"></script>
<script src="../src/engine/moon.js"></script>
<script src="../src/engine/words.js"></script>
<script src="../src/engine/finishes.js"></script>
<script src="../src/engine/card.js"></script>
<script src="../src/engine/sample.js"></script>
<script>
(async function () {
  var mode = new URLSearchParams(location.search).get("mode") || "og";
  try {
    await document.fonts.load('700 40px "Fraunces"');
    await document.fonts.load('italic 600 40px "Fraunces"');
    var s = await LU.sample.load();
    var settings = Object.assign({}, s.settings, { finish: mode === "film" ? "film" : "postcard" });
    var card = await LU.card.create(s.sky, s.strokes, settings); // waits for Gochi Hand and Fraunces
    var cv = document.getElementById(mode === "og" ? "ogCanvas" : "soloCanvas");
    var size = parseInt(new URLSearchParams(location.search).get("size") || "0", 10);
    if (mode !== "og" && size) { cv.width = size; cv.height = size; }
    var ctx = cv.getContext("2d");
    card.drawFrame(ctx, LU.END, "square", cv.width / 1080);
    document.getElementById(mode === "og" ? "og" : "solo").style.display = "block";
    window.__ready = true;
  } catch (e) { window.__error = String(e && e.stack || e); }
})();
</script>
</body>
</html>
