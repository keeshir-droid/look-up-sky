<!doctype html>
<!-- Never deployed. Draws the share picture (assets/og.jpg) and the README picture (docs/preview-postcard.png) with the real engine.
     tests/make-assets.js opens it over http and captures it.  ?mode=og (default) | postcard | film -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Look Up: share picture</title>
<style>
  @font-face { font-family: "Caveat"; src: url("../fonts/caveat-600.woff2") format("woff2"); font-weight: 600; }
  :root { --paper: #f6f2ea; --text: #1c2433; --ink-2: #3a4252; --accent: #1f3a5f; --muted: #6c6a64;
          --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  #og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); display: none; }
  #og .copy { position: absolute; left: 80px; top: 0; bottom: 0; width: 540px; display: flex; flex-direction: column; justify-content: center; }
  #og h1 { font-family: var(--serif); font-weight: 600; font-size: 66px; line-height: 1.1; color: var(--text); margin: 0; letter-spacing: -.01em; }
  #og .url { font-family: var(--serif); font-style: italic; font-size: 30px; color: var(--accent); margin: 28px 0 0; }
  #og .cardwrap { position: absolute; right: 70px; top: 50%; width: 480px; height: 480px; margin-top: -240px; transform: rotate(3deg);
                  border-radius: 22px; box-shadow: 0 18px 40px rgba(28, 36, 51, .22), 0 3px 8px rgba(28, 36, 51, .15); overflow: hidden; }
  #og canvas, #solo canvas { display: block; width: 100%; height: 100%; }
  #solo { display: none; }
</style>
</head>
<body>
<div id="og"><div class="copy"><h1>Saw a shape in the clouds? Send it to someone.</h1><p class="url">look-up-sky.vercel.app</p></div>
  <div class="cardwrap"><canvas id="ogCanvas" width="960" height="960"></canvas></div></div>
<div id="solo"><canvas id="soloCanvas" width="900" height="900"></canvas></div>
<script src="../src/engine/util.js"></script>
<script src="../src/engine/decode.js"></script>
<script src="../src/engine/sky.js"></script>
<script src="../src/engine/trace.js"></script>
<script src="../src/engine/moon.js"></script>
<script src="../src/engine/words.js"></script>
<script src="../src/engine/finishes.js"></script>
<script src="../src/engine/card.js"></script>
<script src="../src/engine/sample.js"></script>
<script>
(async function () {
  var mode = new URLSearchParams(location.search).get("mode") || "og";
  try {
    await document.fonts.load('600 40px "Caveat"');
    var s = await LU.sample.load();
    var settings = Object.assign({}, s.settings, { finish: mode === "film" ? "film" : "postcard" });
    var card = await LU.card.create(s.sky, s.strokes, settings);
    var cv = document.getElementById(mode === "og" ? "ogCanvas" : "soloCanvas");
    var size = parseInt(new URLSearchParams(location.search).get("size") || "0", 10);
    if (mode !== "og" && size) { cv.width = size; cv.height = size; }
    var ctx = cv.getContext("2d");
    card.drawFrame(ctx, LU.END, "square", cv.width / 1080);
    document.getElementById(mode === "og" ? "og" : "solo").style.display = "block";
    window.__ready = true;
  } catch (e) { window.__error = String(e && e.stack || e); }
})();
</script>
</body>
</html>
